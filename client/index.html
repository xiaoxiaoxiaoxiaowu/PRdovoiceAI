<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script src="CSInterface.js"></script>
</head>
<body>
  <div id="app">

    <!-- 连接栏 -->
    <div id="connection-bar">
      <input id="ip-input" type="text" value="127.0.0.1" placeholder="IP">
      <input id="port-input" type="text" value="9527" placeholder="端口">
      <button id="btn-connect" class="btn btn-sm">连接</button>
      <span id="status-indicator" class="status-offline">● 未连接</span>
    </div>

    <!-- 标签页 -->
    <nav id="tabs">
      <button class="tab active" data-tab="voices">🎤 音色库</button>
      <button class="tab" data-tab="clips">📋 剪辑列表</button>
      <button class="tab" data-tab="settings">⚙ 设置</button>
    </nav>

    <!-- 页面一：音色库 -->
    <section id="tab-voices" class="tab-content active">
      <div id="voice-filters">
        <label>版本:</label>
        <select id="filter-version">
          <option value="all">全部</option>
          <option value="2.0">2.0</option>
          <option value="1.0">1.0</option>
        </select>
        <label>性别:</label>
        <select id="filter-gender">
          <option value="all">全部</option>
          <option value="female">女声</option>
          <option value="male">男声</option>
        </select>
        <label>能力:</label>
        <select id="filter-capability">
          <option value="all">全部</option>
          <option value="emotion">情感变化</option>
          <option value="context_texts">引用上文</option>
          <option value="voice_instruction">语音指令</option>
          <option value="voice_tag">语音标签</option>
          <option value="asmr">ASMR</option>
        </select>
        <input id="voice-search" type="text" placeholder="🔍 搜索音色...">
      </div>
      <div id="voice-list"></div>
    </section>

    <!-- 页面二：剪辑列表 -->
    <section id="tab-clips" class="tab-content">
      <div id="project-bar">
        <span id="project-name">未命名项目</span>
        <button id="btn-new-project" class="btn btn-sm">新建</button>
        <button id="btn-save-project" class="btn btn-sm">保存</button>
        <button id="btn-load-project" class="btn btn-sm">打开</button>
      </div>
      <div id="clip-list"></div>
      <div id="clip-actions">
        <button id="btn-add-clip" class="btn">+ 添加一句话</button>
        <button id="btn-import-srt" class="btn">从SRT/TXT导入</button>
      </div>
      <div id="batch-actions">
        <button id="btn-generate-all" class="btn btn-primary">🎬 生成全部</button>
        <button id="btn-generate-selected" class="btn">▶ 生成选中</button>
        <span class="batch-gap"></span>
        <button id="btn-import-pr" class="btn btn-accent">📥 导入PR时间线</button>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-text"></span>
      </div>
      <div id="batch-float" class="hidden">
        <button id="btn-batch-delete" class="btn btn-danger" disabled>🗑 删除</button>
        <button id="btn-select-all" class="btn">全选</button>
        <button id="btn-batch-voice" class="btn btn-sm">🎤 批量改音色</button>
        <span id="batch-count"></span>
      </div>
    </section>

    <!-- 页面三：设置 -->
    <section id="tab-settings" class="tab-content">
      <h3>后端连接</h3>
      <div class="setting-row">
        <label>IP:</label><input id="set-ip" type="text" value="127.0.0.1">
        <label>端口:</label><input id="set-port" type="text" value="9527">
        <button id="btn-test-conn" class="btn btn-sm">测试连接</button>
      </div>

      <h3>默认值</h3>
      <div class="setting-row">
        <label>默认音色:</label>
        <span id="default-voice-name" class="clip-voice-name">未设置</span>
        <input type="hidden" id="set-default-voice">
        <button id="btn-set-default-voice" class="btn btn-sm">更改</button>
      </div>
      <div class="setting-row">
        <label>默认情感:</label>
        <select id="set-default-emotion">
          <option value="neutral">neutral</option>
          <option value="happy">happy</option>
          <option value="sad">sad</option>
          <option value="angry">angry</option>
          <option value="fearful">fearful</option>
          <option value="surprised">surprised</option>
        </select>
      </div>
      <div class="setting-row">
        <label>默认语速:</label>
        <input id="set-default-rate" type="range" min="-50" max="100" value="0">
        <span id="rate-val">0</span>
      </div>
      <div class="setting-row">
        <label>默认尾停 (ms):</label>
        <input id="set-default-silence" type="number" value="300" min="0" max="30000">
      </div>

      <h3>PR 集成</h3>
      <div class="setting-row">
        <label>共享文件夹:</label>
        <input id="set-output-dir" type="text" value="D:/voice_cache" style="width:200px">
      </div>
      <div class="setting-row">
        <label><input id="set-import-at-playhead" type="checkbox" checked> 导入到播放头位置</label>
      </div>
      <div class="setting-row">
        <label><input id="set-auto-fade" type="checkbox" checked> 自动交叉淡入淡出 (5帧)</label>
      </div>

      <h3>缓存</h3>
      <div class="setting-row">
        <button id="btn-clear-cache" class="btn btn-sm">清空缓存</button>
        <span id="cache-info"></span>
      </div>
    </section>
    <!-- 侧边音色选择面板 -->
    <div id="overlay" class="hidden" onclick="closeVoicePanel()"></div>
      <div id="voice-panel" class="hidden">
        <div id="voice-panel-header">
          <span id="voice-panel-title">选择音色</span>
          <button id="btn-close-panel" class="btn btn-sm" onclick="closeVoicePanel()">✕</button>
        </div>
        <!-- 筛选条件（版本/性别/能力）放在上面 -->
        <div id="voice-panel-filters">
          <select id="panel-filter-version">
            <option value="all">全部版本</option>
            <option value="2.0">2.0</option>
            <option value="1.0">1.0</option>
          </select>
          <select id="panel-filter-gender">
            <option value="all">全部性别</option>
            <option value="female">女声</option>
            <option value="male">男声</option>
          </select>
          <select id="panel-filter-capability">
            <option value="all">全部能力</option>
            <option value="emotion">情感变化</option>
            <option value="context_texts">引用上文</option>
            <option value="voice_instruction">语音指令</option>
            <option value="voice_tag">语音标签</option>
            <option value="asmr">ASMR</option>
          </select>
        </div>
        <!-- 搜索框放在下面 -->
        <div id="voice-panel-search">
          <input id="panel-voice-search" type="text" placeholder="🔍 搜索 457 个音色...">
        </div>
          <div id="voice-panel-list"></div>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-overlay" class="hidden" onclick="closeDeleteModal()"></div>
    <div id="delete-modal" class="hidden">
      <div id="delete-modal-header">确认删除</div>
      <div id="delete-modal-body">已选中 <span id="delete-count">0</span> 个剪辑，删除后不可恢复</div>
      <div id="delete-modal-actions">
        <button id="btn-delete-cancel" class="btn">取消</button>
        <button id="btn-delete-confirm" class="btn btn-danger">确认删除</button>
      </div>
    </div>

  </div>
  <script src="main.js"></script>
</body>
</html>
